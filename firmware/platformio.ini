[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bogde/HX711@^0.7.5
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Wireless upload. Set env var KK_OTA_PASS to the OTA_PASS from secrets.h.
[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = 192.168.50.183   ; board IP; give it a DHCP reservation on the router
upload_flags = --auth=${sysenv.KK_OTA_PASS}
